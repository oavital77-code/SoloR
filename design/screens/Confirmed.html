<div class="phone sr" style="height: 900px;">
  <div class="wash" style="height: 420px; background: radial-gradient(90% 60% at 50% 0%, rgba(201,169,110,.18), transparent 70%);"></div>
  <section style="position: relative; padding: 72px 24px 28px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;">
    <span style="width: 88px; height: 88px; border-radius: 50%; display: grid; place-items: center; color: var(--gold); box-shadow: inset 0 0 0 2px var(--gold), 0 0 0 10px var(--gold-soft);">

      <div style="display: flex; align-items: center; gap: 8px; font-size: 14px;"><svg class="sr-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--gold);"><path d="M3 6.5h11v10H3zM14 10h3.5l3 3.5v3H14"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>משלוח · אנטריקוט, <span class="sr-num">2</span> סטייקים</div>

    <div class="card" style="border-color: var(--line-gold);">
